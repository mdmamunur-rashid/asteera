<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <title>Expense Report - ASTEERA</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #008080; padding-bottom: 20px; margin-bottom: 30px; }
        .logo { width: 180px; }
        .report-title { text-align: right; }
        .report-title h1 { margin: 0; color: #008080; font-size: 28px; }
        .filter-status { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e2e8f0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; font-size: 13px; }
        .filter-item b { color: #008080; text-transform: uppercase; font-size: 11px; display: block; margin-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { background: #f8f9fa; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 12px; text-align: left; font-size: 12px; text-transform: uppercase; }
        td { border-bottom: 1px solid #eee; padding: 12px; font-size: 13px; }
        .total-row { font-size: 20px; font-weight: 800; color: #008080; text-align: right; padding: 20px; background: #f0fdfa; border-radius: 8px; }
        .footer { margin-top: 50px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px dashed #e2e8f0; padding-top: 20px; }
    </style>
</head>
<body>

<div class="header">
    <img src="https://lh3.googleusercontent.com/d/1sxBW7iWGbmNx40M0NonM8u8pa68KYhZg" class="logo">
    <div class="report-title">
        <h1>EXPENSE REPORT</h1>
        <div style="font-weight: bold; color: #64748b;">ASTEERA ERP Official Document</div>
    </div>
</div>

<div class="filter-status">
    <div class="filter-item"><b>Report Generated By</b><span id="reportUser"></span></div>
    <div class="filter-item"><b>Search Criteria</b><span id="reportSearch"></span></div>
    <div class="filter-item"><b>Date Range</b><span id="reportRange"></span></div>
</div>

<table id="reportTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>ID</th>
            <th>Category</th>
            <th>Purpose</th>
            <th>Submitted By</th>
            <th style="text-align:right">Amount</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="total-row" id="reportTotal"></div>

<div class="footer">
    This is a system-generated document. Printed on: <span id="reportTime"></span><br>
    © 2026 Asteera ERP System
</div>

<script>
    window.onload = function() {
        const payload = JSON.parse(localStorage.getItem('temp_expense_report'));
        if(!payload) { document.body.innerHTML = "No data found."; return; }

        document.getElementById('reportUser').innerText = payload.user;
        document.getElementById('reportSearch').innerText = payload.searchQuery;
        document.getElementById('reportRange').innerText = `${payload.startDate} to ${payload.endDate}`;
        document.getElementById('reportTotal').innerText = payload.total;
        document.getElementById('reportTime').innerText = new Date().toLocaleString();

        const tbody = document.querySelector('#reportTable tbody');
        payload.data.forEach(e => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${e.date}</td>
                <td><small>${e.id}</small></td>
                <td>${e.category}</td>
                <td><strong>${e.expenseFor}</strong></td>
                <td>${e.submittedBy}</td>
                <td style="text-align:right"><strong>৳${parseFloat(e.amount).toFixed(2)}</strong></td>
            `;
            tbody.appendChild(row);
        });

        // Auto print
        setTimeout(() => { window.print(); }, 800);
    }
</script>
</body>
</html>
