<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        .container { padding: 30px; font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; color: #008080; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        
        .profile-photo-preview { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ff8c00; margin: 0 auto 20px auto; display: block; object-fit: cover; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .form-control[readonly] { background: #f9f9f9; color: #888; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-save { background: #008080; color: white; }
        .btn-pass { background: #ff8c00; color: white; margin-top: 10px; }
        
        .msg { font-size: 14px; margin-top: 10px; text-align: center; display: none; }
        .msg-success { color: #2ecc71; }
        .msg-error { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>My Account Settings</h2>
    
    <div class="grid">
        <!-- Profile Column -->
        <div class="card">
            <h3>Profile Info</h3>
            <img id="previewPhoto" src="https://www.w3schools.com/howto/img_avatar.png" class="profile-photo-preview">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profName" class="form-control">
            </div>
            
            <div class="form-group">
                <label>Photo URL</label>
                <input type="text" id="profPhoto" class="form-control" oninput="document.getElementById('previewPhoto').src = this.value">
            </div>
            
            <div class="form-group">
                <label>Email (Locked)</label>
                <input type="text" id="profEmail" class="form-control" readonly>
            </div>

            <div class="form-group">
                <label>Role</label>
                <input type="text" id="profRole" class="form-control" readonly>
            </div>

            <button class="btn btn-save" onclick="saveProfile()">Update Profile</button>
            <div id="profMsg" class="msg"></div>
        </div>

        <!-- Password Column -->
        <div class="card">
            <h3>Security</h3>
            <p style="color:#666; font-size:13px;">To change your password, please provide your current one first.</p>
            
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="oldPass" class="form-control">
            </div>
            
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPass" class="form-control">
            </div>
            
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confPass" class="form-control">
            </div>

            <button class="btn btn-pass" onclick="changePassword()">Change Password</button>
            <div id="passMsg" class="msg"></div>
        </div>
    </div>
</div>

<script>
    const u = JSON.parse(localStorage.getItem('asteera_user'));

    if (u) {
        document.getElementById('profName').value = u.name;
        document.getElementById('profPhoto').value = u.photo;
        document.getElementById('profEmail').value = u.email;
        document.getElementById('profRole').value = u.role;
        document.getElementById('previewPhoto').src = u.photo || "https://www.w3schools.com/howto/img_avatar.png";
    }

    function saveProfile() {
        const name = document.getElementById('profName').value;
        const photo = document.getElementById('profPhoto').value;
        const msg = document.getElementById('profMsg');

        google.script.run.withSuccessHandler(() => {
            u.name = name; u.photo = photo;
            localStorage.setItem('asteera_user', JSON.stringify(u));
            msg.innerText = "Profile updated!";
            msg.className = "msg msg-success";
            msg.style.display = "block";
            // Refresh sidebar
            window.top.location.reload();
        }).updateProfile(u.email, name, photo);
    }

    function changePassword() {
        const oldP = document.getElementById('oldPass').value;
        const newP = document.getElementById('newPass').value;
        const confP = document.getElementById('confPass').value;
        const msg = document.getElementById('passMsg');

        if(newP !== confP) {
            msg.innerText = "New passwords do not match.";
            msg.className = "msg msg-error";
            msg.style.display = "block";
            return;
        }

        google.script.run.withSuccessHandler(res => {
            msg.style.display = "block";
            if(res.success) {
                msg.innerText = "Password changed successfully!";
                msg.className = "msg msg-success";
                document.getElementById('oldPass').value = "";
                document.getElementById('newPass').value = "";
                document.getElementById('confPass').value = "";
            } else {
                msg.innerText = res.message;
                msg.className = "msg msg-error";
            }
        }).updatePassword(u.email, oldP, newP);
    }
</script>
</body>
</html>
