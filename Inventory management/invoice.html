<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Invoice - ASTEERA</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; color: #333; margin: 0; padding: 20px; font-size: 13px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .invoice-container { width: 100%; max-width: 800px; margin: 0 auto; background: white; border: 1px solid #eee; padding: 30px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .company-logo-box { display: flex; align-items: center; }
        .company-address { text-align: right; line-height: 1.4; color: #333; font-size: 13px; }
        
        .invoice-header-block { text-align: center; margin: 10px 0 20px 0; }
        .invoice-title { font-size: 24px; font-weight: bold; letter-spacing: 3px; color: #008080; margin: 0; }
        .header-line { border-bottom: 2px solid #008080; margin-top: 5px; width: 100%; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 2px 1fr; gap: 20px; margin-bottom: 30px; align-items: stretch; }
        .vertical-divider { border-left: 2px solid #008080; height: 100%; min-height: 80px; }
        
        .invoice-meta { line-height: 1.6; font-size: 13px; }
        .customer-info-box { text-align: right; font-size: 13px; }
        .customer-info-box h4 { margin: 0 0 5px 0; color: #008080; text-transform: uppercase; font-size: 14px; }
        
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .data-table th { background: #f8f9fa; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 10px; text-align: left; font-size: 12px; }
        .data-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: 12px; }
        
        .footer-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; margin-top: 20px; }
        .payable-words { font-weight: bold; font-style: italic; color: #008080; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; font-size: 12px; }
        .status-stamp { font-size: 32px; font-weight: bold; color: #e74c3c; opacity: 0.2; transform: rotate(-15deg); border: 5px solid #e74c3c; display: inline-block; padding: 5px 20px; border-radius: 10px; margin-top: 20px; }
        
        .summary-table { width: 100%; font-size: 13px; }
        .summary-table td { padding: 4px 0; }
        .summary-table td:last-child { text-align: right; font-weight: bold; }
        .grand-total-row { border-top: 2px solid #008080; color: #008080; font-size: 1.2rem; }
        
        .signature-line { border-top: 1px dashed #ccc; padding-top: 10px; margin-top: 50px; text-align: center; font-size: 11px; font-weight: bold; color: #777; }
        .print-btn { background: #008080; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold; float: right; }
        
        @media print { 
            @page { size: A5; margin: 10mm; }
            .print-btn { display: none; } 
            body { padding: 0; margin: 0; background: white; } 
            .invoice-container { border: none; width: 130mm; max-width: 130mm; padding: 0; margin: 0 auto; }
            .invoice-title { font-size: 20px; }
            .data-table th, .data-table td { padding: 4px; font-size: 11px; }
            .summary-table { width: 100%; font-size: 10px; }
            .status-stamp { font-size: 20px; margin-top: 5px; }
        }
    </style>
</head>
<body>
    <div id="print-controls" style="max-width: 800px; margin: 0 auto 10px auto; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="view-toggles" style="display:none;">
                <button class="print-btn" style="float:none; background:#64748b; margin-right:5px;" onclick="switchView('original')">View Original</button>
                <button class="print-btn" style="float:none; background:#008080;" onclick="switchView('current')">View Returned</button>
            </div>
            <select id="branding-select" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; height: 42px;" onchange="renderInvoice(rawInvoiceData)">
                <option value="dynamic">Dynamic Branding</option>
            </select>
        </div>
        <button class="print-btn" onclick="window.print()">Print Invoice</button>
    </div>
    <div class="invoice-container" id="invoice-content"></div>

    <script>
        const soId = "<?= soId ?>";
        const forceBrand = "<?= forceBrand ?>"; // passed server-side; iframe URL params are not readable
        let rawInvoiceData = null;

        if(soId) { google.script.run.withSuccessHandler(data => { rawInvoiceData = data; renderInvoice(data); }).getInvoiceData(soId); }

        /**
         * If a Drive-hosted logo fails to load (usually because the file's
         * sharing is not "Anyone with the link"), retry once via Drive's
         * thumbnail endpoint before giving up and hiding the image (instead
         * of showing the browser's broken-image icon).
         */
        function handleLogoError(img) {
            if (!img.dataset.fallbackTried) {
                img.dataset.fallbackTried = "1";
                const m = img.src.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
                if (m) {
                    img.src = 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400';
                    return;
                }
            }
            console.warn('Brand logo failed to load: ' + img.src);
            img.style.display = 'none';
        }

        function switchView(mode) {
            const url = new URL(window.location.href);
            url.searchParams.set('view', mode);
            window.history.replaceState({}, '', url);
            renderInvoice(rawInvoiceData);
        }

        function renderInvoice(data) {
            if(!data || !data.header) return;
            const h = data.header;
            const items = data.items;
            const brandings = data.brandings || [];

            // Populate select if empty
            const select = document.getElementById('branding-select');
            if (select.options.length === 1 && brandings.length > 0) {
                brandings.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.name;
                    opt.textContent = b.name;
                    select.appendChild(opt);
                });
            }

            // Determine Branding
            let currentBranding = brandings.find(b => b.name === "Asteera") || brandings[0] || {
                name: "Asteera",
                address: "1038, Monipur, Mirpur Model, Dhaka 1216\nMalibag office: 926, Malibag, Dhaka 1217\n+8801821155665 | support@asteera.com",
                logo: "https://lh3.googleusercontent.com/d/1sxBW7iWGbmNx40M0NonM8u8pa68KYhZg"
            };

            // Priority: forceBrand > manual selection > dynamic (order brand)
            if (forceBrand) {
                const forcedBranding = brandings.find(b => b.name === forceBrand);
                if (forcedBranding) {
                    currentBranding = forcedBranding;
                    select.value = forceBrand;
                    select.disabled = true; // Disable when forced
                }
            } else if (select.value === "dynamic") {
                const pageBranding = brandings.find(b => b.name === h.pageName);
                if (pageBranding) currentBranding = pageBranding;
            } else {
                const manualBranding = brandings.find(b => b.name === select.value);
                if (manualBranding) currentBranding = manualBranding;
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const viewMode = urlParams.get('view') || 'current';
            const hasReturns = items.some(i => i.returnInfo && i.returnInfo.toLowerCase().includes('returned'));

            if (hasReturns) document.getElementById('view-toggles').style.display = 'block';

            let displayItems = items;
            let subtotal = h.subtotal;
            let grandTotal = h.grandTotal;

            if (viewMode === 'original' && hasReturns) {
                displayItems = items.map(item => {
                    const match = (item.returnInfo || "").match(/Returned ([\d.]+) items/i);
                    const returnedQty = match ? parseFloat(match[1]) : 0;
                    const originalQty = item.qty + returnedQty;
                    return { ...item, qty: originalQty, total: originalQty * item.price };
                });
                subtotal = displayItems.reduce((sum, i) => sum + i.total, 0);
                grandTotal = subtotal + h.deliveryCharge - h.discount;
            }

            const due = grandTotal - (h.paidAmount || 0);

            document.getElementById('invoice-content').innerHTML = `
                <div class="header">
                    <div class="company-logo-box"><img src="${currentBranding.logo}" width="180" onerror="this.style.display='none'"></div>
                    <div class="company-address">
                        ${currentBranding.address.replace(/\n/g, '<br>')}
                    </div>
                </div>

                <div class="invoice-header-block">
                    <h1 class="invoice-title">${viewMode === 'original' ? 'ORIGINAL INVOICE' : (hasReturns ? 'RETURNED INVOICE' : 'INVOICE')}</h1>
                    <div class="header-line"></div>
                </div>

                <div class="info-grid">
                    <div class="invoice-meta">
                        <img src="https://bwipjs-api.metafloor.com/?bcid=code128&text=${encodeURIComponent(h.invoiceNum)}&scale=2&rotate=N&includetext=false" style="height: 40px; margin-bottom:5px;"><br>
                        <strong>Invoice NO:</strong> ${h.invoiceNum}<br>
                        <strong>Date:</strong> ${h.date}
                    </div>
                    <div class="vertical-divider"></div>
                    <div class="customer-info-box">
                        <h4>Invoice To</h4>
                        <strong>Name:</strong> ${h.customerName}<br>
                        <strong>Phone:</strong> ${h.phone || 'N/A'}<br>
                        <strong>Address:</strong> ${h.address}
                    </div>
                </div>

                <table class="data-table">
                    <thead><tr><th>#</th><th>Image</th><th>Product Description</th><th>Size</th><th>Price</th><th>Qty</th><th>Total</th></tr></thead>
                    <tbody>${displayItems.map((item, i) => `<tr>
                        <td>${i+1}</td>
                        <td style="width:60px; text-align:center;">
                            ${item.image ? `<img src="${item.image}" style="max-width:50px; max-height:50px; border-radius:4px; object-fit:cover;">` : '<div style="width:50px; height:50px; background:#f0f0f0; border-radius:4px; display:inline-block;"></div>'}
                        </td>
                        <td>
                            <strong>${item.name}</strong><br>${item.sku}
                            ${viewMode === 'current' && item.returnInfo ? `<br><small style="color:#e74c3c; font-weight:bold;">(${item.returnInfo})</small>` : ''}
                        </td>
                        <td>${item.size}</td>
                        <td>${parseFloat(item.price).toFixed(2)}</td>
                        <td>${item.qty}</td>
                        <td>${parseFloat(item.total).toFixed(2)}</td>
                    </tr>`).join('')}</tbody>
                </table>

                <div class="footer-grid">
                    <div>
                        <div class="payable-words">Payable: ${Math.max(0, due).toFixed(2)}/- ${numberToWords(Math.max(0, due))} taka only.</div>
                        <div class="status-stamp">${due > 0 ? 'DUE' : 'PAID'}</div>
                        
                        ${h.note ? `
                            <div style="margin-top: 25px; background: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 3px solid #008080;">
                                <div style="font-size: 10px; font-weight: 800; color: #008080; text-transform: uppercase; margin-bottom: 4px;">Special Instructions:</div>
                                <div style="font-size: 12px; color: #444; line-height: 1.4;">${h.note}</div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="summary-box">
                        <table class="summary-table">
                            <tr><td>Subtotal:</td><td>${subtotal.toFixed(2)}</td></tr>
                            <tr><td>Discount:</td><td>${h.discount.toFixed(2)}</td></tr>
                            <tr><td>Delivery Charge:</td><td>${h.deliveryCharge.toFixed(2)}</td></tr>
                            ${h.returnCost > 0 ? `<tr><td style="color:#e74c3c">Return Adjustment:</td><td style="color:#e74c3c">+ ${h.returnCost.toFixed(2)}</td></tr>` : ''}
                            <tr class="grand-total-row"><td>Total Amount:</td><td>${grandTotal.toFixed(2)}</td></tr>
                            <tr><td>Paid Amount:</td><td>${(h.paidAmount||0).toFixed(2)}</td></tr>
                            <tr style="border-top:1px solid #ccc"><td>Due Amount:</td><td>${due.toFixed(2)}</td></tr>
                        </table>
                    </div>
                </div>
                <div class="signature-line">** This is a Generated Invoice, No need to have Signature **</div>
            `;
        }

        function numberToWords(num) {
            const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            const inWords = (n) => {
                if (n < 20) return a[n];
                if (n < 100) return b[Math.floor(n / 10)] + (n % 10 !== 0 ? ' ' + a[n % 10] : '');
                if (n < 1000) return a[Math.floor(n / 100)] + ' Hundred' + (n % 100 !== 0 ? ' ' + inWords(n % 100) : '');
                if (n < 1000000) return inWords(Math.floor(n / 1000)) + ' Thousand' + (n % 1000 !== 0 ? ' ' + inWords(n % 1000) : '');
                return n;
            };
            return inWords(Math.round(num));
        }
    </script>
</body>
</html>
