<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 150px; margin-bottom: 20px; }
        h2 { color: #008080; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-login { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #ff8c00; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #e67e00; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 15px; display: none; }
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #008080; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-card">
    <img src="https://lh3.googleusercontent.com/d/1sxBW7iWGbmNx40M0NonM8u8pa68KYhZg" class="logo">
    <h2>ERP Login</h2>
    
    <div class="form-group">
        <label>Email or Phone</label>
        <input type="text" id="identifier" class="form-control" placeholder="Enter email or phone">
    </div>
    
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••">
    </div>
    
    <button class="btn-login" onclick="handleLogin()">Sign In</button>
    <div id="loader" class="loader"></div>
    <div id="error" class="error-msg"></div>
</div>

<script>
    // Check if already logged in
    window.onload = function() {
        if (localStorage.getItem('asteera_user')) {
            window.top.location.href = "<?= getScriptUrl() ?>";
        }
    };

    function handleLogin() {
        const id = document.getElementById('identifier').value;
        const pass = document.getElementById('password').value;
        const error = document.getElementById('error');
        const loader = document.getElementById('loader');

        if (!id || !pass) {
            error.innerText = "Please fill all fields.";
            error.style.display = "block";
            return;
        }

        error.style.display = "none";
        loader.style.display = "block";

        google.script.run
            .withSuccessHandler(res => {
                loader.style.display = "none";
                if (res.success) {
                    localStorage.setItem('asteera_user', JSON.stringify(res.user));
                    window.top.location.href = "<?= getScriptUrl() ?>";
                } else {
                    error.innerText = res.message;
                    error.style.display = "block";
                }
            })
            .authenticateUser(id, pass);
    }
</script>
</body>
</html>
