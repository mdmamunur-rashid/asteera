<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { padding: 20px; font-family: sans-serif; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; background-color: #008080; }
        .data-table { width: 100%; border-collapse: collapse; background: white; }
        .data-table th, .data-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .data-table th { background: #f8f9fa; font-weight: 600; }
        
        .modal { display: none; position: fixed; z-index: 1001; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 400px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .processing-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #008080; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h2>Supplier Management</h2>
        <button class="btn" onclick="openSupModal()">+ Add New Supplier</button>
    </div>

    <table class="data-table" id="supTable">
        <thead>
            <tr>
                <th>Reg. Date</th>
                <th>Supplier ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>Phone Number</th>
                <th style="text-align:right">Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div id="supModal" class="modal">
    <div class="modal-content">
        <h3 id="supModalTitle">Add New Supplier</h3>
        <input type="hidden" id="isSupEdit" value="false">
        
        <div class="form-group">
            <label>Supplier ID</label>
            <input type="text" id="supId" class="form-control" readonly>
        </div>
        <div class="form-group">
            <label>Supplier Name</label>
            <input type="text" id="supName" class="form-control">
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" id="supAddr" class="form-control">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="supPhone" class="form-control">
        </div>
        
        <div style="text-align:right; margin-top:20px;">
            <button class="btn" style="background:#6c757d" onclick="$('#supModal').hide()">Cancel</button>
            <button class="btn" onclick="saveSup()">Save Supplier</button>
        </div>
    </div>
</div>

<div id="processingOverlay" class="processing-overlay"><div class="spinner"></div></div>

<script>
    let allSuppliers = [];

    $(document).ready(function() {
        loadSuppliers();
    });

    function showProcessing() { $('#processingOverlay').css('display', 'flex'); }
    function hideProcessing() { $('#processingOverlay').hide(); }

    function loadSuppliers() {
        showProcessing();
        google.script.run
          .withSuccessHandler(data => {
            allSuppliers = data;
            renderSupTable(data);
            hideProcessing();
          })
          .poGetSuppliers();
    }

    function renderSupTable(data) {
        const tbody = $('#supTable tbody').empty();
        data.forEach(s => {
            tbody.append(`<tr>
                <td data-label="Date">${s.regDate}</td>
                <td data-label="ID"><strong>${s.id}</strong></td>
                <td data-label="Name">${s.name}</td>
                <td data-label="Address">${s.address}</td>
                <td data-label="Phone">${s.phone}</td>
                <td data-label="Action" style="text-align:right">
                    <button class="btn" style="background:#f39c12; padding:5px 10px;" onclick="editSup('${s.id}')">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn" style="background:#e74c3c; padding:5px 10px;" onclick="deleteSup('${s.id}')">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>`);
        });
    }

    function deleteSup(id) {
        if(!confirm("Are you sure you want to delete this supplier?")) return;
        showProcessing();
        google.script.run.withSuccessHandler(res => {
            if(res.success) {
                allSuppliers = res.updatedList;
                renderSupTable(allSuppliers);
            } else {
                alert(res.message);
            }
            hideProcessing();
        }).supDeleteSupplier(id);
    }

    function openSupModal() {
        $('#supModalTitle').text("Add New Supplier");
        $('#isSupEdit').val("false");
        $('#supName, #supAddr, #supPhone').val("");
        showProcessing();
        google.script.run.withSuccessHandler(id => {
            $('#supId').val(id);
            $('#supModal').show();
            hideProcessing();
        }).supGenerateID();
    }

    function editSup(id) {
        const s = allSuppliers.find(x => x.id === id);
        if(!s) return;
        $('#supModalTitle').text("Edit Supplier");
        $('#isSupEdit').val("true");
        $('#supId').val(s.id);
        $('#supName').val(s.name);
        $('#supAddr').val(s.address);
        $('#supPhone').val(s.phone);
        $('#supModal').show();
    }

    function saveSup() {
        const sup = {
            id: $('#supId').val(),
            name: $('#supName').val(),
            address: $('#supAddr').val(),
            phone: $('#supPhone').val()
        };
        const isEdit = $('#isSupEdit').val() === "true";
        
        if(!sup.name || !sup.phone) return alert("Please enter Name and Phone");

        showProcessing();
        google.script.run.withSuccessHandler(() => {
            $('#supModal').hide();
            loadSuppliers();
            hideProcessing();
        }).supSaveSupplier(sup, isEdit);
    }
</script>
</body>
</html>
