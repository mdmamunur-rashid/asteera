<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Purchase Order - ASTEERA</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; color: #333; margin: 0; padding: 20px; font-size: 13px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .invoice-container { width: 100%; max-width: 800px; margin: 0 auto; background: white; border: 1px solid #eee; padding: 30px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .company-logo-box { display: flex; align-items: center; }
        .company-address { text-align: right; line-height: 1.4; color: #333; font-size: 13px; }
        
        .invoice-header-block { text-align: center; margin: 10px 0 20px 0; }
        .invoice-title { font-size: 24px; font-weight: bold; letter-spacing: 3px; color: #008080; margin: 0; }
        .header-line { border-bottom: 2px solid #008080; margin-top: 5px; width: 100%; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 2px 1fr; gap: 20px; margin-bottom: 30px; align-items: stretch; }
        .vertical-divider { border-left: 2px solid #008080; height: 100%; min-height: 80px; }
        
        .invoice-meta { line-height: 1.6; font-size: 13px; }
        .customer-info-box { text-align: right; font-size: 13px; }
        .customer-info-box h4 { margin: 0 0 5px 0; color: #008080; text-transform: uppercase; font-size: 14px; }
        
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .data-table th { background: #f8f9fa; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 10px; text-align: left; font-size: 12px; }
        .data-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: 12px; }
        
        .footer-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; margin-top: 20px; }
        .payable-words { font-weight: bold; font-style: italic; color: #008080; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; font-size: 12px; }
        
        .summary-box { width: 100%; font-size: 13px; }
        .summary-table { width: 100%; }
        .summary-table td { padding: 4px 0; }
        .summary-table td:last-child { text-align: right; font-weight: bold; }
        .grand-total-row { border-top: 2px solid #008080; color: #008080; font-size: 1.2rem; }
        
        .signature-line { border-top: 1px dashed #ccc; padding-top: 10px; margin-top: 50px; text-align: center; font-size: 11px; font-weight: bold; color: #777; }
        .print-btn { background: #008080; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold; float: right; }
        
        @media print { 
            @page { size: A5; margin: 10mm; }
            .print-btn { display: none; } 
            body { padding: 0; margin: 0; background: white; } 
            .invoice-container { border: none; width: 130mm; max-width: 130mm; padding: 0; margin: 0 auto; }
            .invoice-title { font-size: 20px; }
            .data-table th, .data-table td { padding: 4px; font-size: 11px; }
            .summary-table { font-size: 11px; }
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">Print Document</button>
    <div class="invoice-container" id="po-content">
        <div style="text-align:center; padding:50px;">Loading Purchase Order...</div>
    </div>

    <script>
        const poId = "<?= poId ?>";

        if(poId) {
            google.script.run.withSuccessHandler(renderPO).poGetPODetails(poId);
        }

        function renderPO(data) {
            if(!data || !data.header) {
                const errMsg = (data && data.error) ? `<br><small style="color:red;">Error Details: ${data.error}</small>` : "";
                document.getElementById('po-content').innerHTML = `Purchase Order not found for ID: ${poId}${errMsg}`;
                return;
            }
            
            const h = data.header;
            const brandings = data.brandings || [];
            let currentBranding = brandings.find(b => b.name === "Asteera") || brandings[0] || {
                name: "Asteera",
                address: "1038, Monipur, Mirpur Model, Dhaka 1216\nMalibag office: 926, Malibag, Dhaka 1217\n+8801821155665 | support@asteera.com",
                logo: "https://lh3.googleusercontent.com/d/1sxBW7iWGbmNx40M0NonM8u8pa68KYhZg"
            };

            let total = data.items.reduce((sum, i) => sum + (parseFloat(i.qty) * parseFloat(i.unitCost)), 0);
            
            document.getElementById('po-content').innerHTML = `
                <div class="header">
                    <div class="company-logo-box"><img src="${currentBranding.logo}" width="180"></div>
                    <div class="company-address">
                        ${currentBranding.address.replace(/\n/g, '<br>')}
                    </div>
                </div>

                <div class="invoice-header-block">
                    <h1 class="invoice-title">PURCHASE ORDER</h1>
                    <div class="header-line"></div>
                </div>

                <div class="info-grid">
                    <div class="invoice-meta">
                        <img src="https://bwipjs-api.metafloor.com/?bcid=code128&text=${encodeURIComponent(h.poId)}&scale=2&rotate=N&includetext=false" style="height: 40px; margin-bottom:5px;"><br>
                        <strong>PO ID:</strong> ${h.poId}<br>
                        <strong>Date:</strong> ${h.date}
                    </div>
                    <div class="vertical-divider"></div>
                    <div class="customer-info-box">
                        <h4>Supplier</h4>
                        <strong>Name:</strong> ${h.supplierName}<br>
                        <strong>Phone:</strong> ${h.supplierPhone || 'N/A'}<br>
                        <strong>ID:</strong> ${h.supplierId}
                    </div>
                </div>

                <table class="data-table">
                    <thead><tr><th>#</th><th>Image</th><th>Description</th><th>Size</th><th>Cost</th><th>Qty</th><th>Total</th></tr></thead>
                    <tbody>${data.items.map((i, idx) => {
                        const rowTotal = parseFloat(i.qty) * parseFloat(i.unitCost);
                        return `<tr>
                            <td>${idx + 1}</td>
                            <td style="width:60px; text-align:center;">
                                ${i.image ? `<img src="${i.image}" style="max-width:50px; max-height:50px; border-radius:4px; object-fit:cover;">` : '<div style="width:50px; height:50px; background:#f0f0f0; border-radius:4px; display:inline-block;"></div>'}
                            </td>
                            <td><strong>${i.itemName}</strong><br><small>${i.sku}</small></td>
                            <td>N/A</td>
                            <td>${parseFloat(i.unitCost).toFixed(2)}</td>
                            <td>${i.qty}</td>
                            <td>${rowTotal.toFixed(2)}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table>

                                <div class="footer-grid">
                                    <div>
                                        <div class="payable-words">Total in Words: ${numberToWords(total)} taka only.</div>
                                        <div class="payable-words" style="margin-top:5px; border:none; color:#666;">Authorized Purchase Document</div>
                                    </div>
                                    <div class="summary-box">
                                        <table class="summary-table">
                                            <tr class="grand-total-row"><td>GRAND TOTAL:</td><td>${total.toFixed(2)}</td></tr>
                                        </table>
                                    </div>
                                </div>
                                <div class="signature-line">ASTEERA Official Purchase Order</div>
                            `;
                        }
                
                        function numberToWords(num) {
                            const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
                            const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
                            const inWords = (n) => {
                                if (n < 20) return a[n];
                                if (n < 100) return b[Math.floor(n / 10)] + (n % 10 !== 0 ? ' ' + a[n % 10] : '');
                                if (n < 1000) return a[Math.floor(n / 100)] + ' Hundred' + (n % 100 !== 0 ? ' ' + inWords(n % 100) : '');
                                if (n < 1000000) return inWords(Math.floor(n / 1000)) + ' Thousand' + (n % 1000 !== 0 ? ' ' + inWords(n % 1000) : '');
                                return n;
                            };
                            return inWords(Math.round(num));
                        }
                    </script>
                </body>
                </html>
