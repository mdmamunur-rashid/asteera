name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: asteera-erp/package-lock.json

      - name: Build Next.js app
        working-directory: asteera-erp
        run: |
          npm ci
          npm run build
          mkdir -p tmp
          echo "${{ github.sha }}" > tmp/restart.txt

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: s1304.sgp1.mysecurecloudhost.com
          username: deploy@innerspinbd.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./asteera-erp/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/cache/**
            **/.env*
            next-build.tar.gz
