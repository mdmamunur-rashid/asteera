<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; font-size: 14px; }
        .form-label { font-weight: bold; margin-bottom: 5px; }
        .btn-save { background-color: #008080; color: white; width: 100%; }
        .btn-save:hover { background-color: #006666; color: white; }
    </style>
</head>
<body>
    <h5 class="mb-4">Steadfast Configuration</h5>
    
    <div class="mb-3">
        <label class="form-label">API Key</label>
        <input type="text" id="apiKey" class="form-control" placeholder="Enter Steadfast API Key">
    </div>
    
    <div class="mb-3">
        <label class="form-label">Secret Key</label>
        <input type="password" id="secretKey" class="form-control" placeholder="Enter Steadfast Secret Key">
    </div>
    
    <button class="btn btn-save mt-3" onclick="save()">Save Settings</button>
    <div id="status" class="mt-3 small"></div>

    <script>
        // Load existing config
        google.script.run.withSuccessHandler(config => {
            if (config.apiKey) document.getElementById('apiKey').value = config.apiKey;
            if (config.secretKey) document.getElementById('secretKey').value = config.secretKey;
        }).getSteadfastConfig();

        function save() {
            const apiKey = document.getElementById('apiKey').value;
            const secretKey = document.getElementById('secretKey').value;
            const status = document.getElementById('status');
            
            status.innerHTML = "Saving...";
            google.script.run.withSuccessHandler(() => {
                status.innerHTML = '<span class="text-success">Saved successfully!</span>';
            }).withFailureHandler(err => {
                status.innerHTML = '<span class="text-danger">Error: ' + err.message + '</span>';
            }).saveSteadfastConfig(apiKey, secretKey);
        }
    </script>
</body>
</html>
