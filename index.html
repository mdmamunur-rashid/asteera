            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background: #005a5a; /* Matches your brand color */

        /* The Magic: This iframe is slightly larger than the screen 
           and shifted UP to hide the Google Banner */

            position: absolute;
            top: -18px; /* Pushes the 45px Google banner off the top of the screen */
            left: 0;
            width: 100%;
            height: calc(100% + 45px); /* Expands the height to cover the bottom gap */
            border: none;
        }
    </style>
